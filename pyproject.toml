[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-cart"
version = "0.1.0"
description = "Smart Cart Flask Web Application"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "flask==3.0.0",
    "requests==2.31.0",
    "beautifulsoup4==4.12.2",
    "python-dotenv==1.0.0",
    "google-generativeai",
    "pillow",
]

[tool.setuptools.packages.find]
include = ["app*", "api*"]

