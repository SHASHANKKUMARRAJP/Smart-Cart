<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10-Minute Delivery Comparison | Smart Cart</title>
    <meta name="description"
        content="Compare instant grocery prices from Blinkit, Zepto, and Instamart near you. Get 10-minute delivery prices for milk, eggs, atta, oil, bread, and rice.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

        body {
            font-family: 'Inter', sans-serif;
        }

        .glass-morphism {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        .product-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }

        .platform-badge {
            transition: all 0.2s ease;
        }

        .platform-badge:hover {
            transform: scale(1.05);
        }

        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .premium-shadow {
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .modal-backdrop {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
        }

        .filter-btn {
            transition: all 0.2s ease;
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
    </style>
</head>

<body class="bg-gray-50">
    <!-- Top Header -->
    <header class="glass-morphism sticky top-0 z-40 premium-shadow">
        <div class="container mx-auto px-4 py-6">
            <!-- Simple Navigation Links -->
            <div class="flex justify-between items-center mb-2">
                <a href="javascript:history.back()" class="flex items-center text-gray-600 hover:text-purple-600 font-medium transition-colors">
                    <i class="fas fa-arrow-left mr-2"></i> Back
                </a>
                <div class="flex items-center space-x-6">
                <a href="{{ url_for('main.index') }}"
                    class="text-sm font-medium text-gray-500 hover:text-purple-600 transition-colors">Home</a>
                <a href="{{ url_for('main.ecommerce') }}"
                    class="text-sm font-medium text-gray-500 hover:text-purple-600 transition-colors">E-commerce</a>
                <a href="{{ url_for('main.find_dress') }}"
                    class="text-sm font-bold text-purple-600 hover:text-purple-700 transition-colors flex items-center"><i
                        class="fas fa-sparkles mr-1 text-xs"></i>Find Dress</a>
                {% if session.get('user') %}
                <a href="#"
                    onclick="event.preventDefault(); fetch('{{ url_for('main.auth_logout') }}', {method: 'POST'}).then(() => window.location.href='/');"
                    class="text-sm font-bold text-red-500 hover:text-red-700 transition-colors bg-red-50 px-3 py-1 rounded-full text-center">
                    Logout
                </a>
                {% endif %}
                </div>
            </div>
            <div class="text-center mb-6">
                <h1 class="text-4xl md:text-5xl font-bold text-gray-900 mb-2">
                    10-Minute Delivery Comparison
                </h1>
                <p class="text-lg text-gray-600">
                    Compare instant grocery prices near you
                </p>
            </div>

            <!-- Location and Search Bar -->
            <div class="flex flex-col md:flex-row gap-4 max-w-4xl mx-auto">
                <div class="flex-1 relative">
                    <i
                        class="fas fa-map-marker-alt absolute left-4 top-1/2 transform -translate-y-1/2 text-purple-600"></i>
                    <select
                        class="w-full pl-12 pr-4 py-3 rounded-2xl border border-gray-200 focus:border-purple-500 focus:outline-none focus:ring-2 focus:ring-purple-200 transition-all appearance-none bg-white">
                        <option>Mumbai, Maharashtra</option>
                        <option>Delhi, NCR</option>
                        <option>Bangalore, Karnataka</option>
                        <option>Hyderabad, Telangana</option>
                        <option>Chennai, Tamil Nadu</option>
                    </select>
                </div>

                <div class="flex-1 relative">
                    <i class="fas fa-search absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                    <input type="text" placeholder="Search products..."
                        class="w-full pl-12 pr-4 py-3 rounded-2xl border border-gray-200 focus:border-purple-500 focus:outline-none focus:ring-2 focus:ring-purple-200 transition-all">
                </div>
            </div>
        </div>
    </header>

    <!-- Filter Bar -->
    <section class="container mx-auto px-4 py-6">
        <div class="flex flex-wrap gap-3 justify-center">
            <button
                class="filter-btn px-6 py-2 rounded-full border border-gray-300 text-gray-700 hover:border-purple-500 transition-all"
                data-filter="price">
                <i class="fas fa-tag mr-2"></i>Price
            </button>
            <button
                class="filter-btn px-6 py-2 rounded-full border border-gray-300 text-gray-700 hover:border-purple-500 transition-all"
                data-filter="delivery">
                <i class="fas fa-clock mr-2"></i>Delivery Time
            </button>
            <button
                class="filter-btn px-6 py-2 rounded-full border border-gray-300 text-gray-700 hover:border-purple-500 transition-all"
                data-filter="platform">
                <i class="fas fa-store mr-2"></i>Platform
            </button>
        </div>
    </section>

    <!-- Trending Essentials Section -->
    <main class="container mx-auto px-4 py-8">
        <section>
            <div class="text-center mb-10">
                <h2 class="text-3xl font-bold text-gray-900 mb-3">Trending Essentials</h2>
                <p class="text-gray-600 text-lg">Compare prices across all instant delivery platforms</p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8" id="productsGrid">
                <!-- Product cards will be dynamically generated -->
            </div>
        </section>
    </main>

    <!-- Platform Comparison Modal -->
    <div id="comparisonModal" class="fixed inset-0 z-50 hidden">
        <div class="modal-backdrop absolute inset-0" onclick="closeModal()"></div>
        <div class="flex items-center justify-center min-h-screen p-4">
            <div
                class="bg-white rounded-3xl max-w-2xl w-full max-h-[90vh] overflow-y-auto premium-shadow relative transform transition-all">
                <div class="sticky top-0 bg-white border-b border-gray-100 p-6 rounded-t-3xl">
                    <div class="flex justify-between items-center">
                        <h3 class="text-2xl font-bold text-gray-900">Platform Comparison</h3>
                        <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 transition-colors">
                            <i class="fas fa-times text-2xl"></i>
                        </button>
                    </div>
                </div>

                <div id="modalContent" class="p-6">
                    <!-- Dynamic content will be inserted here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Price Note -->
    <footer class="container mx-auto px-4 py-8 mt-12">
        <div class="text-center">
            <p class="text-sm text-gray-500 italic">
                *Prices are estimated and may vary by location.
            </p>
        </div>
    </footer>

    <script>
        // Product data
        const products = [
            {
                id: 1,
                name: "Milk 1L",
                image: "https://images.unsplash.com/photo-1550583724-b2692b85b150?w=300&h=300&fit=crop",
                estimatedPrice: "₹54-62",
                platforms: [
                    { name: "Blinkit", price: "₹54", time: "10 mins", logo: "🛵" },
                    { name: "Zepto", price: "₹58", time: "10 mins", logo: "⚡" },
                    { name: "Instamart", price: "₹62", time: "15 mins", logo: "📦" }
                ]
            },
            {
                id: 2,
                name: "Eggs (12)",
                image: "https://images.unsplash.com/photo-1518569656558-1f25e69d93d7?w=300&h=300&fit=crop",
                estimatedPrice: "₹84-96",
                platforms: [
                    { name: "Blinkit", price: "₹84", time: "10 mins", logo: "🛵" },
                    { name: "Zepto", price: "₹89", time: "10 mins", logo: "⚡" },
                    { name: "Instamart", price: "₹96", time: "15 mins", logo: "📦" }
                ]
            },
            {
                id: 3,
                name: "Atta 1kg",
                image: "https://images.unsplash.com/photo-1586201375881-ab35a5850be3?w=300&h=300&fit=crop",
                estimatedPrice: "₹45-52",
                platforms: [
                    { name: "Blinkit", price: "₹45", time: "10 mins", logo: "🛵" },
                    { name: "Zepto", price: "₹48", time: "10 mins", logo: "⚡" },
                    { name: "Instamart", price: "₹52", time: "15 mins", logo: "📦" }
                ]
            },
            {
                id: 4,
                name: "Cooking Oil 1L",
                image: "https://images.unsplash.com/photo-1586201375881-ab35a5850be3?w=300&h=300&fit=crop",
                estimatedPrice: "₹135-148",
                platforms: [
                    { name: "Blinkit", price: "₹135", time: "10 mins", logo: "🛵" },
                    { name: "Zepto", price: "₹140", time: "10 mins", logo: "⚡" },
                    { name: "Instamart", price: "₹148", time: "15 mins", logo: "📦" }
                ]
            },
            {
                id: 5,
                name: "Bread",
                image: "https://images.unsplash.com/photo-1509440159596-0249088772ff?w=300&h=300&fit=crop",
                estimatedPrice: "₹35-42",
                platforms: [
                    { name: "Blinkit", price: "₹35", time: "10 mins", logo: "🛵" },
                    { name: "Zepto", price: "₹38", time: "10 mins", logo: "⚡" },
                    { name: "Instamart", price: "₹42", time: "15 mins", logo: "📦" }
                ]
            },
            {
                id: 6,
                name: "Rice 1kg",
                image: "https://images.unsplash.com/photo-1586201375881-ab35a5850be3?w=300&h=300&fit=crop",
                estimatedPrice: "₹78-85",
                platforms: [
                    { name: "Blinkit", price: "₹78", time: "10 mins", logo: "🛵" },
                    { name: "Zepto", price: "₹82", time: "10 mins", logo: "⚡" },
                    { name: "Instamart", price: "₹85", time: "15 mins", logo: "📦" }
                ]
            }
        ];

        // Initialize the page
        document.addEventListener('DOMContentLoaded', function () {
            renderProducts();
            setupFilters();
        });

        // Render product cards
        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = products.map(product => `
                <div class="product-card bg-white rounded-3xl overflow-hidden premium-shadow">
                    <div class="relative">
                        <img src="${product.image}" alt="${product.name}" class="w-full h-48 object-cover">
                        <div class="absolute top-4 right-4 bg-white/90 backdrop-blur-sm rounded-full px-3 py-1">
                            <span class="text-sm font-semibold text-purple-600">${product.estimatedPrice}</span>
                        </div>
                    </div>
                    
                    <div class="p-6">
                        <h3 class="text-xl font-bold text-gray-900 mb-4">${product.name}</h3>
                        
                        <div class="flex justify-around mb-6">
                            ${product.platforms.map(platform => `
                                <div class="platform-badge text-center cursor-pointer" onclick="showPlatformDetails('${product.id}', '${platform.name}')">
                                    <div class="text-2xl mb-1">${platform.logo}</div>
                                    <div class="text-xs text-gray-600">${platform.name}</div>
                                </div>
                            `).join('')}
                        </div>
                        
                        <button onclick="showComparison(${product.id})" 
                                class="w-full gradient-bg text-white py-3 rounded-2xl font-semibold hover:opacity-90 transition-opacity">
                            <i class="fas fa-chart-bar mr-2"></i>Check Live Price
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // Show comparison modal
        function showComparison(productId) {
            const product = products.find(p => p.id === productId);
            const modal = document.getElementById('comparisonModal');
            const content = document.getElementById('modalContent');

            content.innerHTML = `
                <div class="mb-6">
                    <div class="flex items-center gap-4 mb-6">
                        <img src="${product.image}" alt="${product.name}" class="w-20 h-20 rounded-2xl object-cover">
                        <div>
                            <h4 class="text-2xl font-bold text-gray-900">${product.name}</h4>
                            <p class="text-gray-600">Compare prices across platforms</p>
                        </div>
                    </div>
                    
                    <div class="space-y-4">
                        ${product.platforms.map(platform => `
                            <div class="border border-gray-200 rounded-2xl p-4 hover:border-purple-300 transition-colors">
                                <div class="flex items-center justify-between">
                                    <div class="flex items-center gap-3">
                                        <div class="text-3xl">${platform.logo}</div>
                                        <div>
                                            <h5 class="font-semibold text-gray-900">${platform.name}</h5>
                                            <p class="text-sm text-gray-600">${platform.time} delivery</p>
                                        </div>
                                    </div>
                                    <div class="text-right">
                                        <div class="text-2xl font-bold text-purple-600">${platform.price}</div>
                                        <button onclick="visitStore('${platform.name}')" 
                                                class="mt-2 px-4 py-2 bg-purple-100 text-purple-700 rounded-xl hover:bg-purple-200 transition-colors text-sm font-medium">
                                            Visit Store
                                        </button>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;

            modal.classList.remove('hidden');
        }

        // Show platform details
        function showPlatformDetails(productId, platformName) {
            const product = products.find(p => p.id == productId);
            const platform = product.platforms.find(p => p.name === platformName);

            alert(`${platform.name}: ${platform.price} - ${platform.time} delivery`);
        }

        // Close modal
        function closeModal() {
            document.getElementById('comparisonModal').classList.add('hidden');
        }

        // Visit store (placeholder)
        function visitStore(platformName) {
            alert(`Redirecting to ${platformName}...`);
        }

        // Setup filters
        function setupFilters() {
            const filterButtons = document.querySelectorAll('.filter-btn');

            filterButtons.forEach(button => {
                button.addEventListener('click', function () {
                    // Toggle active state
                    filterButtons.forEach(btn => btn.classList.remove('active'));
                    this.classList.add('active');

                    // Apply filter logic here
                    const filterType = this.dataset.filter;
                    console.log('Filter applied:', filterType);
                });
            });
        }
    </script>
    <!-- Floating Home/Back Button added for navigation -->
    <a href="/" style="position: fixed; bottom: 20px; left: 20px; z-index: 9999; background: #667eea; color: white; width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); text-decoration: none;" title="Go Home">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    </a>
</body>

</html>
