<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8f9fa"/>
    </linearGradient>
  </defs>

  <rect width="400" height="300" fill="url(#bg-grad)"/>

  <g transform="translate(40, 50)">
    
    <!-- Top arc -->
    <path d="M75 10 C 95 10, 115 25, 125 45 C 110 30, 85 20, 60 20 Z" fill="#000080"/>
    
    <!-- Bottom left arc -->
    <path d="M20 120 C 10 95, 20 70, 40 55 C 30 75, 30 100, 45 115 Z" fill="#000080"/>
    
    <!-- Bottom right arc -->
    <path d="M130 140 C 150 130, 160 105, 150 85 C 145 105, 125 125, 105 130 Z" fill="#000080"/>

    <!-- Gray Triangle Shield -->
    <path d="M75 25 L140 60 L100 160 L25 100 Z" fill="#D3D3D3" opacity="0.8"/>

    <!-- Central Square -->
    <rect x="55" y="60" width="50" height="50" fill="#000080"/>
    
    <!-- Stylized 'R' -->
    <path d="M65 70 L80 70 C 88 70, 92 75, 92 82 C 92 88, 88 90, 80 90 L75 90 L75 100 L65 100 Z" fill="white"/>
    <path d="M80 90 L95 105 L85 105 L75 90 Z" fill="white"/>
    
    <!-- Cutout in 'R' -->
    <path d="M75 78 L80 78 C 83 78, 85 80, 85 82 C 85 84, 83 85, 80 85 L75 85 Z" fill="#000080"/>

  </g>

  <!-- IRCTC Text -->
  <text x="200" y="165" font-family="Arial, sans-serif" font-weight="900" font-size="60" fill="#000080" letter-spacing="4">
    IRCTC
  </text>
  
</svg>
